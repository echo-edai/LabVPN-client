name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-13
            args: --target x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
          - name: Linux (Ubuntu)
            os: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Prepare sidecar placeholders
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='apps/desktop/src-tauri/binaries';fs.mkdirSync(p,{recursive:true});for(const f of ['mihomo','labvpn-helper','wintun.dll'])fs.writeFileSync(p+'/'+f,'');"

      - name: Fetch mihomo sidecar
        run: node scripts/fetch-sidecars.mjs --force

      - name: Build privileged helper
        run: |
          cargo build -p labvpn-helper --release
          node -e "
            const fs=require('fs'),path=require('path');
            const name=process.platform==='win32'?'labvpn-helper.exe':'labvpn-helper';
            fs.copyFileSync(path.join('target','release',name),path.join('apps','desktop','src-tauri','binaries','labvpn-helper'));
          "

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "LabVPN ${{ github.ref_name }}"
          releaseBody: |
            LabVPN ${{ github.ref_name }}

            - 三页配置：订阅 / 校内 VPN / SSH 转发
            - 融合特调规则：10.0.0.0/8 → 校内 VPN，国内直连，国外走订阅
            - 校内网络自动检测，在校内自动跳过 VPN
            - 平台：macOS / Windows / Ubuntu / AlmaLinux（rpm）
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
