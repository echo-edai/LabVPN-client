name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-15-intel
            args: --target x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
          - name: Linux (Ubuntu)
            os: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Prepare sidecar placeholders
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='apps/desktop/src-tauri/binaries';fs.mkdirSync(p,{recursive:true});for(const f of ['mihomo','mihomo.exe','labvpn-helper','labvpn-helper.exe','fdu-connect','fdu-connect.exe','wintun.dll','GeoSite.dat','geoip.metadb'])fs.writeFileSync(p+'/'+f,'');"

      - name: Fetch mihomo + build fdu-connect (bundled)
        run: node scripts/fetch-sidecars.mjs --force --require-fdu

      - name: Build privileged helper
        run: node scripts/fetch-sidecars.mjs --helper

      - name: Sign bundled sidecars (macOS, Developer ID or ad-hoc)
        if: runner.os == 'macOS'
        shell: bash
        env:
          SEC_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          for f in apps/desktop/src-tauri/binaries/mihomo apps/desktop/src-tauri/binaries/labvpn-helper apps/desktop/src-tauri/binaries/fdu-connect; do
            [ -s "$f" ] || continue
            if [ -n "$SEC_APPLE_SIGNING_IDENTITY" ]; then
              codesign --force --options runtime --timestamp --sign "$SEC_APPLE_SIGNING_IDENTITY" "$f"
            else
              codesign --force --sign - "$f"
            fi
          done
          echo "✅ sidecar 签名完成（$( [ -n "$SEC_APPLE_SIGNING_IDENTITY" ] && echo Developer ID || echo ad-hoc )）"

      - name: Import Windows certificate (when configured)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "未配置 WINDOWS_CERTIFICATE，跳过证书导入"
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null

      - name: Configure Windows signing config
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: |
          if (-not $env:WINDOWS_CERT_THUMBPRINT) {
            Write-Host "未配置 WINDOWS_CERT_THUMBPRINT，跳过自动签名配置"
            exit 0
          }
          node -e "const fs=require('fs');const p='apps/desktop/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.windows={...(c.bundle.windows||{}),certificateThumbprint:process.env.WINDOWS_CERT_THUMBPRINT,digestAlgorithm:'sha256',timestampUrl:'http://timestamp.digicert.com'};fs.writeFileSync(p,JSON.stringify(c,null,2));"

      - name: Configure signing environment (Developer ID when configured, ad-hoc on macOS otherwise)
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
          SEC_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SEC_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SEC_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SEC_APPLE_ID: ${{ secrets.APPLE_ID }}
          SEC_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SEC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SEC_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          export_env() {
            local value="${!1}"
            if [ -n "$value" ]; then
              echo "$2=$value" >> "$GITHUB_ENV"
            fi
          }
          export_env SEC_APPLE_SIGNING_IDENTITY APPLE_SIGNING_IDENTITY
          export_env SEC_APPLE_CERTIFICATE APPLE_CERTIFICATE
          export_env SEC_APPLE_CERTIFICATE_PASSWORD APPLE_CERTIFICATE_PASSWORD
          export_env SEC_APPLE_ID APPLE_ID
          export_env SEC_APPLE_PASSWORD APPLE_PASSWORD
          export_env SEC_APPLE_TEAM_ID APPLE_TEAM_ID
          export_env SEC_KEYCHAIN_PASSWORD KEYCHAIN_PASSWORD
          # Apple Silicon 上必须存在有效签名（否则下载后 Gatekeeper 会报「已损坏」）；
          # 未配置 Developer ID 时使用 ad-hoc 签名，至少可右键打开/在隐私设置中允许。
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$SEC_APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "ℹ️ 未配置 Apple 证书：macOS 使用 ad-hoc 签名"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "LabVPN ${{ github.ref_name }}"
          releaseBody: |
            ## LabVPN ${{ github.ref_name }}

            跨平台自动分流客户端：复旦校内 VPN + 机场订阅 + 公网 SSH 一体化。

            ### 本版更新
            - **内置 fdu-connect**：无需单独安装校内 VPN 连接器
            - 凭据仅本机加密保存，含密码的临时配置在启动后立即销毁，绝不上传云端
            - 校内外自动检测：校内直连、校外自动 VPN + 分流
            - 四平台安装包：macOS（dmg）/ Windows（exe、msi）/ Ubuntu（deb、AppImage）/ AlmaLinux（rpm）

            ### 安装提示
            - macOS：若未签名/公证，首次打开请右键 → 打开；正式签名需 Apple Developer 证书
            - Windows：SmartScreen 提示时选择“仍要运行”
            - Linux：`sudo apt install ./LabVPN_*.deb` 或 `chmod +x *.AppImage && ./LabVPN_*.AppImage`

            ### 合规
            本 Release 附带 fdu-connect（AGPL-3.0）与 mihomo（GPL-3.0）的许可证、NOTICE 与源码归档。

            详见 README 与 docs/USER_GUIDE.md。
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="$(find target -maxdepth 6 -type d -name "LabVPN.app" 2>/dev/null | head -1 || true)"
          if [ -z "$APP" ]; then
            APP="$(find . -maxdepth 8 -type d -name "LabVPN.app" 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$APP" ]; then
            echo "❌ 找不到 LabVPN.app，无法校验签名" >&2
            exit 1
          fi
          echo "校验：$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Identifier|Signature|flags" | head -4
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "✅ 签名有效（ad-hoc 或 Developer ID）"

      - name: Attach fdu-connect source archive (AGPL compliance)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -o "fdu-connect-source-a904877.zip" \
            "https://github.com/AkiraSalvare/fdu-connect/archive/a904877f0eda0c7b1d7933ad6e80d5e8d3ffd584.zip"
          gh release upload "${{ github.ref_name }}" "fdu-connect-source-a904877.zip" --clobber
