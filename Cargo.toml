[workspace]
resolver = "2"
members = [
    "crates/labvpn-core",
    "crates/labvpn-helper",
    # "apps/desktop/src-tauri",  # 应用层稍后接入
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["LabVPN Contributors"]
repository = "https://github.com/labvpn/labvpn-client"
description = "LabVPN — 复旦校园网/订阅/SSH 一体化自动分流客户端"

[workspace.dependencies]
# 序列化
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
# 错误与日志
thiserror = "2.0.21"
anyhow = "1.0.104"
log = "0.4.34"
env_logger = "0.11.11"
# 时间 / 编码 / 加密
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.22.1"
sha2 = "0.10.9"
aes-gcm = "0.10.3"
getrandom = "0.3.4"
uuid = { version = "1.28.0", features = ["v4"] }
# 网络
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net", "fs"] }
futures-util = "0.3.31"
# 系统
libc = "0.2.191"
if-addrs = "0.13.4"
# Tauri
tauri = { version = "2.12.4", features = ["tray-icon", "protocol-asset"] }
tauri-build = "2.7.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
