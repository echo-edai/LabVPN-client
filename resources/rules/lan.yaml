# 局域网 / 保留网段（rule-provider，classical/yaml）
# 注意：故意不包含 10.0.0.0/8 —— 该网段已由 FDUIP 规则接管（需求：10/8 → 校内 VPN）。
# 如果是家庭/实验室的 10.x 局域网，生成器会依据本机直连子网自动添加 DIRECT 规则。
payload:
  - IP-CIDR,127.0.0.0/8
  - IP-CIDR,169.254.0.0/16
  - IP-CIDR,192.168.0.0/16
  - IP-CIDR,172.16.0.0/12
  - IP-CIDR,100.64.0.0/10
  - IP-CIDR,224.0.0.0/4
  - IP-CIDR,255.255.255.255/32
  - IP-CIDR6,::1/128
  - IP-CIDR6,fc00::/7
  - IP-CIDR6,fe80::/10
